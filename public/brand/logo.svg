<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073B6F" />
      <stop offset="100%" stop-color="#0B5FA5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39A9E8" />
      <stop offset="100%" stop-color="#0B5FA5" />
    </linearGradient>
  </defs>

  <!-- Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Cart & Mandi Symbol -->
    <rect x="5" y="5" width="70" height="70" rx="18" fill="url(#blueGrad)" />
    <!-- Leaf Accent -->
    <path d="M50 15 C62 15 68 25 65 35 C52 35 48 25 50 15 Z" fill="#72B82A" />
    <path d="M54 22 Q58 28 62 32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Basket/Store Lines -->
    <path d="M22 34 L58 34 L52 58 L28 58 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M30 42 L50 42" stroke="#39A9E8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M32 50 L48 50" stroke="#39A9E8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="64" r="3.5" fill="#FFFFFF" />
    <circle cx="48" cy="64" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <!-- KiranaMart -->
  <text x="95" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#073B6F" letter-spacing="-0.5">
    Kirana<tspan fill="#0B5FA5">Mart</tspan><tspan fill="#39A9E8">247</tspan>
  </text>

  <!-- Tagline / Concept -->
  <text x="96" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#667085" letter-spacing="2.2" text-transform="uppercase">
    Today's Wholesale Rates
  </text>

  <!-- Small accent dot -->
  <circle cx="342" cy="40" r="3" fill="#72B82A" />
</svg>
